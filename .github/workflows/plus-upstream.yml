# Swap Plus: avisa (com uma issue) quando a extensão original claude-swap-status
# lança versão estável nova. O Swap Plus foi reescrito em plus/, então nada é
# trazido automaticamente: a issue serve para avaliar se há algo a portar.
name: Swap Plus — avisar sobre a extensão original

on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Comparar com o original
        run: |
          BASE="v$(node -p "require('./plus/package.json').swapPlus.upstreamExtension")"
          TAG=$(git ls-remote --tags --refs https://github.com/smith89k/claude-swap-status.git 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Original: $TAG · base do Swap Plus: $BASE"
          if [ "$(printf '%s\n%s\n' "$BASE" "$TAG" | sort -V | tail -1)" = "$BASE" ]; then echo "Em dia."; exit 0; fi
          TITLE="A extensão original lançou $TAG"
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "in:title \"$TITLE\"" --json title --jq "map(select(.title == \"$TITLE\")) | length")
          if [ "$OPEN" != "0" ]; then echo "O aviso já existe."; exit 0; fi
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "A extensão original (smith89k/claude-swap-status) lançou $TAG. O Swap Plus está na base $BASE.

          O que mudou: https://github.com/smith89k/claude-swap-status/compare/$BASE...$TAG

          O Swap Plus foi reescrito em \`plus/\`, então nada entra sozinho. Avaliar se há algo a portar; depois, atualizar \`swapPlus.upstreamExtension\` em \`plus/package.json\` e fechar esta issue."

# Swap Plus: testa os instaladores numa máquina limpa de verdade (Mac e Windows
# do GitHub), do jeito que o MANUAL manda: instala o VS Code, roda o comando de
# instalação e confere a extensão (desde a 3.0 os instaladores só instalam a
# extensão; não há mais motor). Roda quando os instaladores mudam e quando uma
# versão nova da extensão é publicada (aí confere também que a versão instalada é
# a que acabou de sair).
name: Swap Plus — testar a instalação

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Swap Plus — publicar a extensão"]
    types: [completed]
  push:
    branches: [main]
    paths: ["plus/scripts/install.sh", "plus/scripts/install.ps1", ".github/workflows/plus-install-test.yml"]

permissions:
  contents: read

env:
  # Tag que acabou de ser publicada (plus-vX.Y.Z) quando vem da publicação; vazio nos outros casos.
  TAG_PUBLICADA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}

jobs:
  mac:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: VS Code
        run: brew install --cask visual-studio-code
      - name: Instalar (o mesmo comando do MANUAL, usando o script deste commit)
        run: bash plus/scripts/install.sh
      - name: Conferir a extensão
        run: |
          EXTS=$("/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code" --list-extensions --show-versions)
          echo "$EXTS"
          echo "$EXTS" | grep -q '^paulo-local\.swap-plus@' || { echo "::error::extensão não instalada"; exit 1; }
          case "$TAG_PUBLICADA" in
            plus-v[0-9]*)
              ESPERADA="paulo-local.swap-plus@${TAG_PUBLICADA#plus-v}"
              echo "$EXTS" | grep -qxF "$ESPERADA" || { echo "::error::instalou outra versão (esperada $ESPERADA)"; exit 1; }
              echo "Versão instalada: $ESPERADA"
              ;;
          esac

  windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: VS Code
        shell: pwsh
        run: choco install vscode -y --no-progress
      - name: Instalar (Windows PowerShell 5.1, o mesmo do MANUAL, usando o script deste commit)
        shell: powershell
        # UTF-8 explícito: é o que o irm recebe do GitHub no comando do MANUAL.
        run: Get-Content -Raw -Encoding UTF8 plus/scripts/install.ps1 | Invoke-Expression
      - name: Conferir a extensão
        shell: powershell
        run: |
          $code = "$env:ProgramFiles\Microsoft VS Code\bin\code.cmd"
          if (-not (Test-Path $code)) { $code = "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin\code.cmd" }
          $exts = & $code --list-extensions --show-versions
          $exts
          if (-not ($exts -match '^paulo-local\.swap-plus@')) { Write-Error "extensão não instalada"; exit 1 }
          if ($env:TAG_PUBLICADA -match '^plus-v(\d+\.\d+\.\d+)$') {
            $esperada = "paulo-local.swap-plus@" + $Matches[1]
            if (-not ($exts -contains $esperada)) { Write-Error "instalou outra versão (esperada $esperada)"; exit 1 }
            "Versão instalada: $esperada"
          }
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Testes da extensão no Windows (dados simulados; smoke --unit, se existir)
        shell: bash
        run: |
          if [ -f plus/test/smoke.js ]; then
            node plus/test/smoke.js --unit
          else
            echo "plus/test/smoke.js não existe: pulado."
          fi
